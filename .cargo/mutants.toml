# Mutation testing configuration for multiplay
# Focuses mutation testing on core domain and DSP algorithms

examine_globs = [
    "crates/amp-core-engine/src/dsp/**",
    "crates/amp-core-engine/src/playback/**",
    "crates/amp-domain/**",
]

exclude_globs = [
    "crates/amp-adapter-cpal/**",
    "crates/amp-adapter-youtube/**",
    "crates/amp-adapter-tui/**",
    "crates/amp-adapter-gui/**",
    "crates/amp-app/**",
]

timeout_multiplier = 3.0
