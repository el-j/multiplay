name: Online source broken (YouTube, Bandcamp, radio)
description: Search or playback from an online source stopped working.
labels: ["provider-breakage"]
body:
  - type: markdown
    attributes:
      value: |
        Online services change without notice, so these break more often than the player itself.
        A fix usually ships as a new beta; please include a link we can test with.
  - type: dropdown
    id: source
    attributes:
      label: Source
      options:
        - YouTube
        - Bandcamp
        - Internet radio / stream link
        - Other
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: What fails?
      options:
        - Search finds nothing
        - A result or link won't play
        - Playback stops or stutters
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: A link or search text that shows the problem
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: What the app says
      description: The message in the search window or under the player, if any.
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Preferences → About → Copy diagnostics.
      render: text
