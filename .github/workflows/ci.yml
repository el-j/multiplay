name: Continuous Integration & Pure-Rust Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # The release workflow runs the full CI on the tagged commit before packaging.
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # System packages needed to build cpal (ALSA) and eframe/winit (X11, Wayland, GL) on Linux.
  LINUX_DEPS: >-
    pkg-config libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
    libx11-dev libxi-dev libxcursor-dev libxrandr-dev libgl1-mesa-dev

jobs:
  quality-gate:
    name: Native-Code Policy, Format, Lints & Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_DEPS

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Native-code policy (all targets, incl. build-dependencies)
        run: |
          ./scripts/verify_pure_rust.sh
          ./scripts/verify_pure_rust.sh --self-test

      - name: Format Check (rustfmt)
        run: cargo fmt --all -- --check

      - name: Strict Clippy Audit (zero warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rustdoc Build (warnings are errors)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  supply-chain:
    name: Licenses, Advisories & Bans (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      # Every release download ships this file; building it here catches a dependency whose
      # license cargo-about cannot resolve before a release is tagged.
      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3

      - name: Third-party license bundle
        run: cargo about generate --locked about.hbs -o THIRD_PARTY_LICENSES.html

      - name: Upload the license bundle
        uses: actions/upload-artifact@v7
        with:
          name: third-party-licenses
          path: THIRD_PARTY_LICENSES.html
          if-no-files-found: error
          retention-days: 14

  matrix-test:
    name: Tests (${{ matrix.os }})
    needs: quality-gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, ubuntu-latest, windows-latest ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_DEPS

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # Hardware tests are #[ignore]d; everything else uses a null audio sink.
      # The guard fails if any test writes multiplay state into the (sandboxed) HOME.
      - name: Workspace tests (hermetic, no audio hardware)
        shell: bash
        run: ./scripts/check_hermetic_tests.sh

      - name: DJ release-build checks (10-minute soak, speed budgets)
        shell: bash
        run: |
          cargo test --release --locked -p amp-core-engine --test dj_soak --test dj_four_deck --test dj_analysis --test dj_mixer
          cargo test --release --locked -p amp-adapter-gui --test dj_waveform_perf

      # Measured CPU and memory of the engine idle and playing FLAC/MP3 (TASK-179). The table
      # lands on the run's summary page; see docs/performance.md. Windows runners are too
      # noisy for a stable CPU number, so it runs on Linux and macOS.
      - name: Resource budgets (release build, measured)
        if: runner.os != 'Windows'
        shell: bash
        run: cargo test --release --locked -p amp-adapter-gui --test resource_budget -- --ignored --nocapture
