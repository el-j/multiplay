name: Nightly fuzz

# Property-based fuzzing of every parser that reads untrusted input (TASK-185): skins, playlists,
# CUE sheets, radio streams, phone messages, Bandcamp answers and damaged audio files. Pure Rust
# (proptest) instead of cargo-fuzz, whose libFuzzer is C++ and outside the native-code policy.
# A failure prints the minimal input; it becomes a regression test before the fix.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      cases:
        description: Cases per property
        default: '20000'

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz parsers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FUZZ_CASES: ${{ github.event.inputs.cases || '20000' }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config \
            libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxi-dev \
            libxcursor-dev libxrandr-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fuzz
        run: |
          cargo test --release --locked \
            -p amp-core-engine --test fuzz_skin \
            -p amp-adapter-storage --test fuzz_lists \
            -p amp-adapter-http --test fuzz_icy \
            -p amp-adapter-remote --test fuzz_protocol \
            -p amp-adapter-bandcamp --test fuzz_search \
            -p amp-adapter-decoder --test corrupt_files
