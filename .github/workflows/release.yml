name: Automated Cross-Platform Release & Publishing

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  LINUX_DEPS: >-
    pkg-config libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
    libx11-dev libxi-dev libxcursor-dev libxrandr-dev libgl1-mesa-dev

jobs:
  build-release:
    name: Build & Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: multiplay-macos-arm64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: multiplay-macos-x86_64.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: multiplay-linux-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: multiplay-windows-x86_64.zip
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_DEPS

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }} -p amp-app -p amp-adapter-gui

      # The GUI is the app bundle's main executable; the TUI ships next to it.
      - name: Package macOS app bundle
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          BIN=target/${{ matrix.target }}/release
          APP=staging/Multiplay.app/Contents
          mkdir -p "$APP/MacOS" "$APP/Resources" staging/bin
          cp scripts/Info.plist "$APP/Info.plist"
          cp "$BIN/multiplay-gui" "$APP/MacOS/Multiplay"
          cp "$BIN/amp-app" staging/bin/multiplay-tui
          cp README.md LICENSE staging/
          chmod +x "$APP/MacOS/Multiplay" staging/bin/multiplay-tui
          tar -czf ${{ matrix.artifact_name }} -C staging .

      - name: Package Linux binaries
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          BIN=target/${{ matrix.target }}/release
          mkdir -p staging/bin
          cp "$BIN/multiplay-gui" staging/bin/multiplay
          cp "$BIN/amp-app" staging/bin/multiplay-tui
          cp README.md LICENSE staging/
          chmod +x staging/bin/*
          tar -czf ${{ matrix.artifact_name }} -C staging .

      - name: Package Windows binaries
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          BIN=target/${{ matrix.target }}/release
          mkdir -p staging/bin
          cp "$BIN/multiplay-gui.exe" staging/bin/multiplay.exe
          cp "$BIN/amp-app.exe" staging/bin/multiplay-tui.exe
          cp README.md LICENSE staging/
          cd staging && 7z a ../${{ matrix.artifact_name }} *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-assets/*
          generate_release_notes: true
          draft: false
          # Tags like v0.1.0-rc.1 are published as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
