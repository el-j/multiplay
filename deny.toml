# cargo-deny policy (TASK-124). Run: cargo deny check
# Licenses must be compatible with distributing multiplay under MPL-2.0.

[graph]
all-features = false

[advisories]
# Unmaintained crates are reported; known-vulnerable crates fail the check.
unmaintained = "workspace"
yanked = "deny"
# Every ignore names the task that removes it. Review on each release.
ignore = [
    # fast-float 0.2 (via rusty_ytdl -> boa_engine) reads out of bounds on empty input.
    # No upgrade exists upstream; the YouTube resolver rework (TASK-157) must drop or patch it.
    { id = "RUSTSEC-2025-0003", reason = "rusty_ytdl/boa dependency; tracked in TASK-157" },
]

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "OFL-1.1",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "LicenseRef-UFL-1.0",
]

# egui's bundled fonts (Ubuntu Font Licence 1.0 + OFL) are not detected automatically.
[[licenses.clarify]]
crate = "epaint_default_fonts"
expression = "(MIT OR Apache-2.0) AND OFL-1.1 AND LicenseRef-UFL-1.0"
license-files = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # Native-code policy (also enforced by scripts/verify_pure_rust.sh).
    { crate = "openssl-sys", reason = "vendored OpenSSL is forbidden; use rustls" },
    { crate = "openssl-src", reason = "vendored OpenSSL is forbidden; use rustls" },
    { crate = "libsqlite3-sys", reason = "SQLite is forbidden; use redb" },
    { crate = "aws-lc-sys", reason = "aws-lc is forbidden; rustls uses ring" },
    { crate = "cmake", reason = "cmake-driven native builds are forbidden" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
