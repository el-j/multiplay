[package]
name = "amp-core-engine"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false
description = "Core playback orchestrator, RAM precaching, DSP pipeline and event dispatcher"

[dependencies]
amp-domain = { workspace = true }
amp-ports = { workspace = true }
tokio = { workspace = true }
rtrb = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
rubato = "5.0"
rustfft = "6.4"
num-complex = "0.4"
lofty = "0.25"
uuid = { workspace = true }
zip = { version = "9.1", default-features = false, features = ["deflate"] }
rand = "0.10"
toml = "1"

[dev-dependencies]
proptest = "1.12"
