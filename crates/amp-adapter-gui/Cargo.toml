[package]
name = "amp-adapter-gui"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[[bin]]
name = "multiplay-gui"
path = "src/main.rs"

# Debian package (TASK-181): `cargo deb -p amp-adapter-gui --no-build` after a release build of
# amp-app and amp-adapter-gui. Installs both apps, the desktop entry and the icons.
[package.metadata.deb]
name = "multiplay"
maintainer = "multiplay contributors <https://github.com/el-j/multiplay/issues>"
copyright = "multiplay contributors"
license-file = ["../../LICENSE", "0"]
extended-description = "Lightweight audiophile music player in pure Rust: classic windows with magnetic docking, gapless playback of almost every audio format, a library browser, DJ mode and phone remote control."
section = "sound"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/multiplay-gui", "usr/bin/multiplay", "755"],
    ["target/release/amp-app", "usr/bin/multiplay-tui", "755"],
    ["../../assets/linux/multiplay.desktop", "usr/share/applications/multiplay.desktop", "644"],
    ["../../assets/icon/multiplay-16.png", "usr/share/icons/hicolor/16x16/apps/multiplay.png", "644"],
    ["../../assets/icon/multiplay-32.png", "usr/share/icons/hicolor/32x32/apps/multiplay.png", "644"],
    ["../../assets/icon/multiplay-48.png", "usr/share/icons/hicolor/48x48/apps/multiplay.png", "644"],
    ["../../assets/icon/multiplay-64.png", "usr/share/icons/hicolor/64x64/apps/multiplay.png", "644"],
    ["../../assets/icon/multiplay-128.png", "usr/share/icons/hicolor/128x128/apps/multiplay.png", "644"],
    ["../../assets/icon/multiplay-256.png", "usr/share/icons/hicolor/256x256/apps/multiplay.png", "644"],
    ["../../assets/icon/multiplay-512.png", "usr/share/icons/hicolor/512x512/apps/multiplay.png", "644"],
    ["../../THIRD_PARTY_LICENSES.html", "usr/share/doc/multiplay/THIRD_PARTY_LICENSES.html", "644"],
    ["../../docs/privacy.md", "usr/share/doc/multiplay/privacy.md", "644"],
    ["../../CHANGELOG.md", "usr/share/doc/multiplay/CHANGELOG.md", "644"],
]

[dependencies]
tracing = { workspace = true }
amp-domain = { workspace = true }
amp-ports = { workspace = true }
amp-core-engine = { path = "../amp-core-engine" }
amp-adapter-cpal = { path = "../amp-adapter-cpal" }
amp-adapter-decoder = { path = "../amp-adapter-decoder" }
amp-adapter-storage = { path = "../amp-adapter-storage" }
amp-adapter-youtube = { path = "../amp-adapter-youtube" }
amp-adapter-soulseek = { path = "../amp-adapter-soulseek" }
amp-adapter-p2p = { path = "../amp-adapter-p2p" }
amp-adapter-http = { path = "../amp-adapter-http" }
amp-adapter-bandcamp = { path = "../amp-adapter-bandcamp" }
amp-adapter-media-controls = { path = "../amp-adapter-media-controls" }
# The main window's HWND for the Windows media session (TASK-173).
raw-window-handle = "0.6"
# `clipboard` is needed for copy and paste (Cmd/Ctrl+C, V) in every text field.
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland", "clipboard", "accesskit"] }
# egui 0.37 ships its emoji/icon fonts (NotoEmoji, emoji-icon-font) only behind this feature;
# without it every icon (▶ 📁 🔊 ...) renders as a box. Bundled fonts, no system font lookup.
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
tokio = { workspace = true, features = ["net", "rt", "time"] }
rtrb = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
amp-adapter-remote = { path = "../amp-adapter-remote" }
if-addrs = "0.15"
image = { version = "0.25", default-features = false, features = ["bmp", "png"] }



[dev-dependencies]
proptest = "1.12"
tempfile = "3.27"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
