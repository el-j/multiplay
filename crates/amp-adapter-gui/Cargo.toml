[package]
name = "amp-adapter-gui"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[[bin]]
name = "multiplay-gui"
path = "src/main.rs"

[dependencies]
amp-domain = { workspace = true }
amp-ports = { workspace = true }
amp-core-engine = { path = "../amp-core-engine" }
amp-adapter-cpal = { path = "../amp-adapter-cpal" }
amp-adapter-decoder = { path = "../amp-adapter-decoder" }
amp-adapter-storage = { path = "../amp-adapter-storage" }
amp-adapter-youtube = { path = "../amp-adapter-youtube" }
amp-adapter-soulseek = { path = "../amp-adapter-soulseek" }
amp-adapter-p2p = { path = "../amp-adapter-p2p" }
amp-adapter-http = { path = "../amp-adapter-http" }
amp-adapter-bandcamp = { path = "../amp-adapter-bandcamp" }
# `clipboard` is needed for copy and paste (Cmd/Ctrl+C, V) in every text field.
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland", "clipboard"] }
# egui 0.37 ships its emoji/icon fonts (NotoEmoji, emoji-icon-font) only behind this feature;
# without it every icon (▶ 📁 🔊 ...) renders as a box. Bundled fonts, no system font lookup.
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
tokio = { workspace = true, features = ["net", "rt", "time"] }
rtrb = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
amp-adapter-remote = { path = "../amp-adapter-remote" }
if-addrs = "0.15"
image = { version = "0.25", default-features = false, features = ["bmp", "png"] }



[dev-dependencies]
proptest = "1.12"
tempfile = "3.27"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
