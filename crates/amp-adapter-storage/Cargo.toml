[package]
name = "amp-adapter-storage"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false
description = "Pure-Rust embedded ACID persistence adapter using redb and lofty metadata tagger"

[dependencies]
tracing = { workspace = true }
amp-domain = { workspace = true }
amp-ports = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
redb = "4.4"
lofty = "0.25"
# Fallback reader for containers lofty does not know (CAF, Matroska/WebM, ADPCM WAV).
symphonia = { version = "0.6", default-features = false, features = ["caf", "mkv", "wav", "aiff", "ogg", "isomp4", "mp1", "mp2", "mp3", "flac"] }
# Compact serde encoding for database values (bincode is discontinued).
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
async-trait = { workspace = true }
uuid = { workspace = true }

# Album thumbnails for the library browser (TASK-172); pure-Rust PNG and JPEG (zune-jpeg).
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
amp-test-support = { path = "../amp-test-support" }
proptest = "1.12"
tempfile = "3.27"
