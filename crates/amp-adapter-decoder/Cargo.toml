[package]
name = "amp-adapter-decoder"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false
description = "Pure-Rust multi-format audio demuxer and decoder adapter using Symphonia"

[dependencies]
tracing = { workspace = true }
amp-domain = { workspace = true }
amp-ports = { workspace = true }
symphonia = { version = "0.6", default-features = false, features = ["mp1", "mp2", "mp3", "flac", "pcm", "vorbis", "aac", "alac", "adpcm", "isomp4", "ogg", "wav", "aiff", "caf", "mkv"] }
# Opus (ADR-005): pinned exactly; pure Rust, SIMD intrinsics only.
rusty-opus = "=1.0.2"
# WavPack (TASK-231): pure Rust, no unsafe, no dependencies; pinned exactly (0.1).
wavicle = { version = "=0.1.0", default-features = false, features = ["decode"] }
rtrb = { workspace = true }

[dev-dependencies]
proptest = "1.12"
