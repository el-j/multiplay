[package]
name = "amp-app"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[dependencies]
amp-domain = { workspace = true }
amp-ports = { workspace = true }
amp-core-engine = { path = "../amp-core-engine" }
amp-adapter-cpal = { path = "../amp-adapter-cpal" }
amp-adapter-decoder = { path = "../amp-adapter-decoder" }
amp-adapter-storage = { path = "../amp-adapter-storage" }
amp-adapter-youtube = { path = "../amp-adapter-youtube" }
amp-adapter-spotify = { path = "../amp-adapter-spotify" }
amp-adapter-soulseek = { path = "../amp-adapter-soulseek" }
amp-adapter-p2p = { path = "../amp-adapter-p2p" }
amp-adapter-http = { path = "../amp-adapter-http" }
amp-adapter-bandcamp = { path = "../amp-adapter-bandcamp" }
amp-adapter-tui = { path = "../amp-adapter-tui" }
tokio = { workspace = true }
ratatui = "0.30"
crossterm = "0.29"
uuid = { workspace = true }
rtrb = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "rt", "macros", "time"] }
rtrb = { workspace = true }
amp-adapter-remote = { path = "../amp-adapter-remote" }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake", "connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde_json = { workspace = true }
