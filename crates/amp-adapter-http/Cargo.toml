[package]
name = "amp-adapter-http"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false
description = "Pure-Rust HTTP and Internet Radio (Icecast/Shoutcast) stream resolver adapter"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
amp-domain = { workspace = true }
amp-ports = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
# TLS via rustls with the ring provider (the documented C/asm exception). reqwest's own
# `rustls` feature would pull aws-lc-rs, so it is built without a provider and ring is
# installed at runtime.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
proptest = "1.12"
tokio = { workspace = true }
