[package]
name = "amp-adapter-http"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Pure-Rust HTTP and Internet Radio (Icecast/Shoutcast) stream resolver adapter"

[dependencies]
amp-domain = { workspace = true }
amp-ports = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
tokio = { workspace = true }
