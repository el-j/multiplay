[workspace]
members = [
    "crates/amp-domain",
    "crates/amp-ports",
    "crates/amp-core-engine",
    "crates/amp-adapter-cpal",
    "crates/amp-adapter-decoder",
    "crates/amp-adapter-storage",
    "crates/amp-adapter-youtube",
    "crates/amp-adapter-spotify",
    "crates/amp-adapter-tui",
    "crates/amp-adapter-soulseek",
    "crates/amp-adapter-p2p",
    "crates/amp-adapter-gui",
    "crates/amp-adapter-remote",
    "crates/amp-adapter-http",
    "crates/amp-app",
]
resolver = "2"

[workspace.dependencies]
# Internal Workspace Crates
amp-domain = { path = "crates/amp-domain" }
amp-ports = { path = "crates/amp-ports" }

# Utilities & Shared
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
async-trait = "0.1"
thiserror = "1.0"
tokio = { version = "1.40", features = ["sync", "rt-multi-thread", "macros", "fs", "io-util", "time"] }
rtrb = "0.3"
